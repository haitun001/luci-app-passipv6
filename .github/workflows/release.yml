name: Check, build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passipv6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Validate metadata and translations
        run: |
          python3 tests/static.py
          node --check htdocs/luci-static/resources/view/passipv6.js
          sh -n tools/install.sh root/usr/libexec/passipv6 root/etc/init.d/passipv6
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext
          msgfmt --check --check-format -o /dev/null po/zh_Hans/passipv6.po
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          grep -Fxq "## $version" CHANGELOG.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$version"; fi

  build:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare package feed
        run: |
          mkdir -p "$RUNNER_TEMP/passipv6-feed/luci-app-passipv6" sdk-output
          cp -a Makefile htdocs po root "$RUNNER_TEMP/passipv6-feed/luci-app-passipv6/"
      - name: Build ImmortalWrt 25.12.1 packages
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb
        env:
          ARCH: x86_64-openwrt-25.12.1
          CONTAINER: immortalwrt/sdk
          FEED_DIR: ${{ runner.temp }}/passipv6-feed
          ARTIFACTS_DIR: ${{ github.workspace }}/sdk-output
          PACKAGES: luci-app-passipv6
          V: s
      - name: Prepare release assets
        shell: bash
        run: |
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          revision="$(sed -n 's/^PKG_RELEASE:=//p' Makefile)"
          mkdir dist
          for package in luci-app-passipv6 luci-i18n-passipv6-zh-cn; do
            mapfile -t files < <(find sdk-output -type f -name "$package-$version-r$revision.apk")
            test "${#files[@]}" -eq 1
            cp "${files[0]}" dist/
          done
          python3 tools/release.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passipv6-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: passipv6-release
          path: dist
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python3 tools/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "PassIPV6 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
