name: Check, build and release

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passipv6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Validate metadata and translations
        run: |
          python3 tests/static.py
          node --check htdocs/luci-static/resources/view/passipv6.js
          for script in tools/*.sh root/usr/libexec/passipv6 root/etc/init.d/passipv6; do sh -n "$script"; done
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gettext
          msgfmt --check --check-format -o /dev/null po/zh_Hans/passipv6.po
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          grep -Fxq "## $version" CHANGELOG.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "$version"; fi

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare official SDK and build plugin packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gawk gettext libncurses-dev libssl-dev rsync unzip zstd
          sudo mkdir -p /opt/passipv6-build
          sudo chown "$(id -u):$(id -g)" /opt/passipv6-build
          sh tools/prepare-sdk.sh
          PASSIPV6_SDK=/opt/passipv6-build/sdk/immortalwrt-sdk-25.12.1-x86-64_gcc-14.3.0_musl.Linux-x86_64 sh tools/build.sh
          python3 tools/release.py artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passipv6-release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: passipv6-release
          path: dist
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          python3 tools/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "PassIPV6 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
